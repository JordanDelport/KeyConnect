<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - KeyConnect</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Header Styling */
        header {
            background-color: #ffffff;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
        }

        header div {
            color: black;
            text-align: center;
            font-size: 36px;
        }

        /* Navigation Links */
        nav {
            margin-top: 20px;
        }

        nav a {
            text-decoration: none;
            color: #ff8c00;
            margin: 0 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: #cc6a00;
        }

        /* Hero Section (Main Banner) */
        .hero {
            height: 600px;
            background-image: url('https://images.pexels.com/photos/4245929/pexels-photo-4245929.jpeg');
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        /* Background overlay to improve text visibility */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .hero h1 {
            font-size: 60px;
            font-weight: 700;
            margin-bottom: 20px;
            z-index: 2;
        }

        .hero p {
            font-size: 22px;
            margin-bottom: 40px;
            z-index: 2;
        }

        .hero button {
            padding: 15px 30px;
            background-color: #ff8c00;
            color: white;
            font-size: 20px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            z-index: 2;
        }

        .hero button:hover {
            background-color: #cc6a00;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #ffffff;
            color: black;
            font-size: 16px;
            margin-top: 50px;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .hero h1 {
                font-size: 40px;
            }
            .hero p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div><a href="index.html" style="text-decoration: none; color: black;">KeyConnect</a></div>
        <nav>
            <a href="about.html">About</a>
            <a href="offer.html">What We Offer</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Looking for High-Quality Leads?</h1>
        <p>KeyConnect connects you to high-quality buyers and sellers, providing tailored lead generation strategies for real estate agents.</p>
        <!-- Fixed Learn More Button with working link -->
        <a href="offer.html"><button>Learn More</button></a>
    </div>

    <footer>
        <p>Contact us: <strong>Jordan van Heerden:</strong> 066 022 3278 | <strong>Kihara Bezuidenhout:</strong> 071 631 3829</p>
    </footer>

</body>
</html>
