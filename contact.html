<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - KeyConnect</title>
    <style>
        /* Same as previous pages */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        h2, h3 {
            color: #333;
        }

        /* Header Styling */
        header {
            background-color: #1f1f1f;
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            text-decoration: none;
            color: white;
            margin: 0 15px;
            font-size: 18px;
        }

        header a:hover {
            color: #ff8c00;
        }

        /* Container for all content */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        /* Contact Form */
        form {
            display: grid;
            gap: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        textarea {
            resize: vertical;
            height: 150px;
        }

        .cta button {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .cta button:hover {
            background-color: #cc6a00;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #1f1f1f;
            color: white;
            font-size: 16px;
            margin-top: 50px;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .container {
                padding: 20px;
            }
            header {
                font-size: 20px;
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div>KeyConnect</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="offer.html">What We Offer</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <div class="container">
        <section id="contact">
            <h2>Contact Us</h2>
            <form>
                <input type="text" placeholder="First Name" required>
                <input type="text" placeholder="Last Name" required>
                <input type="tel" placeholder="Phone Number" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Message" required></textarea>
                <div class="cta">
                    <button type="submit">Submit</button>
                </div>
            </form>
        </section>
    </div>

    <footer>
        <p>Contact us: <strong>Jordan van Heerden:</strong> 066 022 3278 | <strong>Kihara Bezuidenhout:</strong> 071 631 3829</p>
    </footer>
</body>
</html>
