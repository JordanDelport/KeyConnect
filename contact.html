<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - KeyConnect</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        /* Header Styling */
        header {
            background-color: #1f1f1f;
            color: white;
            padding: 30px;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Main Content Container */
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background-color: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        /* Contact Form Styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        label {
            font-size: 18px;
            color: #333;
        }

        input, textarea {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        button[type="submit"] {
            background-color: #ff8c00;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #cc6a00;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #1f1f1f;
            color: white;
            font-size: 16px;
            margin-top: 50px;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            .container {
                padding: 20px;
            }

            header {
                font-size: 24px;
            }

            button[type="submit"] {
                padding: 12px 25px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <header>Contact Us - KeyConnect</header>

    <div class="container">
        <h2>Get In Touch</h2>
        <p>If you have any questions or need further information, please feel free to contact us using the form below:</p>

        <!-- Contact Form -->
        <form action="#" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>

            <label for="number">Phone Number:</label>
            <input type="text" id="number" name="number" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="description">Your Message:</label>
            <textarea id="description" name="description" rows="5" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

    <footer>
        <p>Contact us: <strong>Jordan van Heerden:</strong> 066 022 3278 | <strong>Kihara Bezuidenhout:</strong> 071 631 3829</p>
    </footer>
</body>
</html>
