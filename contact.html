<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - KeyConnect</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333; /* Dark text for better visibility */
        }

        /* Header Styling */
        header {
            background-color: #ffffff;
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
        }

        header div {
            color: black;
            text-align: center;
            font-size: 36px;
        }

        /* Navigation Links */
        nav {
            margin-top: 20px;
        }

        nav a {
            text-decoration: none;
            color: #ff8c00;
            margin: 0 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: #cc6a00;
        }

        /* Contact Form Section */
        .contact-form {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
            background-color: #f9f9f9;
            padding: 20px;
        }

        .form-container {
            width: 50%;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .form-container label {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }

        .form-container input, .form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .form-container button {
            background-color: #ff8c00;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .form-container button:hover {
            background-color: #cc6a00;
        }

        /* Footer Styling */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #ffffff;
            color: black;
            font-size: 16px;
            margin-top: 50px;
        }

    </style>
</head>
<body>

    <header>
        <div><a href="index.html" style="text-decoration: none; color: black;">KeyConnect</a></div>
        <!-- Navigation Links -->
        <nav>
            <a href="about.html">About</a>
            <a href="offer.html">What We Offer</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <div class="contact-form">
        <div class="form-container">
            <h2>Contact Us</h2>
            <form action="submit_form.php" method="POST">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>Contact us: <strong>Jordan van Heerden:</strong> 066 022 3278 | <strong>Kihara Bezuidenhout:</strong> 071 631 3829</p>
    </footer>

</body>
</html>
